<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#43a047">
  <title>Semua Produk - BATAM GO</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
  <body>
  <!-- HEADER (sama seperti index.html) -->
  <div class="header">
    <div class="search-bar">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="cariProduk" placeholder="Cari produk favoritmu...">
    </div>
    <div class="header-icons">
      <a href="keranjang.html" class="cart-icon">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-badge" id="badgeKeranjang">0</span>
      </a>
      <a href="profil.html">
        <i class="fas fa-user"></i>
      </a>
    </div>
  </div>

  <!-- Spacer karena header position:fixed -->
  <div style="height: 60px;"></div>

  <!-- JUDUL HALAMAN -->
  <div class="wrap">
    <div class="section-title">
      <span>Semua Produk</span>
    </div>

    <!-- KATEGORI (LACI/DRAWER) -->
    <div class="kategori-wrap" id="kategoriWrap">
      <button class="kategori-bar" id="kategoriBar" type="button">
        <span class="kb-kiri"><i class="fas fa-th-large kb-icon"></i><span class="kb-label">Kategori:</span> <b id="kategoriTerpilih">Semua</b></span>
        <i class="fas fa-chevron-down kb-panah"></i>
      </button>
      <div class="kategori-drawer" id="kategoriDrawer">
        <a href="#" class="category-item aktif" data-kategori="semua"><i class="fas fa-th-large"></i><span>Semua</span></a>
        <a href="#" class="category-item" data-kategori="pakaian-pria"><i class="fas fa-male"></i><span>Pakaian Pria</span></a>
        <a href="#" class="category-item" data-kategori="pakaian-wanita"><i class="fas fa-female"></i><span>Pakaian Wanita</span></a>
        <a href="#" class="category-item" data-kategori="mobil"><i class="fas fa-car"></i><span>Mobil</span></a>
        <a href="#" class="category-item" data-kategori="motor"><i class="fas fa-motorcycle"></i><span>Motor</span></a>
        <a href="#" class="category-item" data-kategori="prabotan"><i class="fas fa-couch"></i><span>Prabotan</span></a>
        <a href="#" class="category-item" data-kategori="elektronik"><i class="fas fa-tv"></i><span>Elektronik</span></a>
        <a href="#" class="category-item" data-kategori="alat-musik"><i class="fas fa-guitar"></i><span>Alat Musik</span></a>
        <a href="#" class="category-item" data-kategori="aksesoris"><i class="fas fa-gem"></i><span>Aksesoris</span></a>
        <a href="#" class="category-item" data-kategori="lainnya"><i class="fas fa-box-open"></i><span>Lainnya</span></a>
      </div>
    </div>

    <!-- DAFTAR PRODUK - id HARUS "daftarProduk" -->
    <div class="products-container">
      <div class="products-grid" id="daftarProduk">
        <p style="grid-column:1/-1;text-align:center;color:#888;padding:30px;">Memuat produk dari Firebase...</p>
      </div>
    </div>
  </div>

  <!-- LOADER PRODUK -->
  <script type="module" src="produk-loader.js"></script>

  <!-- BOTTOM NAVIGATION (pembeli) - Kategori aktif karena ini halaman Semua Produk -->
  <nav class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span>Beranda</span></a>
    <a href="produk.html" class="active"><i class="fas fa-th-large"></i><span>Kategori</span></a>
    <a href="keranjang.html"><i class="fas fa-shopping-cart"></i><span>Keranjang</span></a>
    <a href="profil.html"><i class="fas fa-user"></i><span>Akun</span></a>
  </nav>
</body>
  </html>
