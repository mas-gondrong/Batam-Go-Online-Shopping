<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#43a047">
  <title>Detail Produk | BATAM GO</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }
    body {
      background:#eef6fc;
      padding-bottom:115px;
    }
    .header-detail {
      background:linear-gradient(135deg,#e53935,#fb8c00 55%,#43a047);
      color:white;
      padding:14px;
      display:flex;
      align-items:center;
      gap:12px;
      position:sticky;
      top:0;
      z-index:99;
    }
    .header-detail a {
      color:white;
      font-size:20px;
      text-decoration:none;
    }
    .wrapper-detail {
      padding:15px;
    }
    .detail-image {
      width:100%;
      height:320px;
      object-fit:contain;
      background:white;
      border-radius:8px;
      margin-bottom:12px;
    }
    .diskon-badge {
      display:inline-block;
      background:#ff4757;
      color:white;
      padding:4px 8px;
      border-radius:4px;
      font-size:13px;
      margin-bottom:8px;
    }
    .nama-produk {
      font-size:20px;
      font-weight:bold;
      margin-bottom:8px;
    }
    .harga-sekarang {
      font-size:24px;
      color:#2e7d46;
      font-weight:bold;
    }
    .harga-lama {
      color:#999;
      text-decoration:line-through;
      margin-left:8px;
      font-size:16px;
    }
    .info-terjual {
      margin:8px 0 16px 0;
      color:#666;
    }
    .box-deskripsi {
      background:white;
      padding:14px;
      border-radius:8px;
      margin-bottom:20px;
    }
    .box-deskripsi h4 {
      margin-bottom:8px;
    }
    .loading-text {
      text-align:center;
      padding:40px;
    }
    .footer-action {
      position:fixed;
      bottom:52px;
      left:0;
      width:100%;
      background:white;
      padding:12px 15px;
      display:flex;
      gap:10px;
      border-top:1px solid #ddd;
    }
    .btn-keranjang {
      flex:1;
      background:#2196f3;
      color:white;
      border:none;
      padding:12px;
      border-radius:6px;
      font-size:16px;
    }
    .btn-beli {
      flex:1;
      background:linear-gradient(135deg,#e53935,#fb8c00 55%,#43a047);
      color:white;
      border:none;
      padding:12px;
      border-radius:6px;
      font-size:16px;
    }

    .toast-sukses{
  position:fixed;
  bottom:140px;
  left:50%;
  transform:translateX(-50%);
  background-color:#22c55e;
  color:#ffffff;
  padding:14px 22px;
  border-radius:8px;
  z-index:9999;
  display:none;
 }

    /* BOTTOM NAVIGATION (pembeli) - duduk di bawah footer-action */
    .bottom-nav {
      position:fixed; bottom:0; left:0; width:100%;
      background:white; display:flex; border-top:1px solid #eee;
      z-index:99;
    }
    .bottom-nav a {
      flex:1; text-align:center; padding:8px 0;
      color:#999; text-decoration:none; font-size:11px;
    }
    .bottom-nav a i { font-size:18px; display:block; margin-bottom:2px; }
    .bottom-nav a.active { color:#2e7d46; }

    /* ===== KARTU TOKO PENJUAL (di atas deskripsi) ===== */
    .kartu-toko-wrap { margin:16px 0; }
    .kartu-toko {
      display:flex; align-items:center; gap:12px;
      background:white; padding:12px; border-radius:10px;
      text-decoration:none; color:inherit; border:1px solid #eee;
    }
    .kartu-toko:active { transform:translateY(1px); }
    .kt-ikon {
      width:44px; height:44px; border-radius:50%; flex-shrink:0;
      background:linear-gradient(135deg,#e53935,#fb8c00 55%,#43a047);
      color:white; position:relative; overflow:hidden;
      display:flex; align-items:center; justify-content:center;
    }
    .kt-ikon .huruf { font-size:18px; font-weight:bold; }
    .kt-ikon img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .kt-info { flex:1; min-width:0; }
    .kt-nama { font-size:15px; font-weight:bold; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .kt-rating { font-size:12px; color:#888; margin-top:2px; }
    .kt-kunjungi {
      background:linear-gradient(135deg,#e53935,#fb8c00 55%,#43a047);
      color:white; padding:8px 14px; border-radius:6px; font-size:13px; font-weight:bold;
      white-space:nowrap;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-detail">
    <a href="index.html"><i class="fas fa-arrow-left"></i></a>
    <h3>Detail Produk</h3>
  </div>

  <div class="wrapper-detail" id="kontenDetail">
    <p class="loading-text">⏳ Memuat detail produk...</p>
  </div>

<!-- Firebase Config -->
<script type="module" src="firebase-config.js"></script>

<!-- Script Baca Detail Produk (PERBAIKAN) -->
<script type="module">
import { auth, db } from './firebase-config.js';
import { ref, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

// Cek apakah pembeli sudah login. Kalau belum, arahkan ke halaman login.
function cekLoginDulu() {
  if (!auth.currentUser) {
    alert('🛒 Silakan login atau daftar dulu untuk membeli.');
    window.location.href = 'auth/login.html';
    return false;
  }
  return true;
}

// Ambil ID dari URL
const urlParams = new URLSearchParams(window.location.search);
const idProduk = urlParams.get('id');
const kontenDetail = document.getElementById("kontenDetail");

console.log("✅ ID Produk dari URL:", idProduk);

if(!idProduk){
  kontenDetail.innerHTML = `<p class="loading-text">❌ Tidak ada ID produk di link</p>`;
}else{

  const singleRef = ref(db, `produk/${idProduk}`);
  get(singleRef).then((snapshot)=>{
    console.log("✅ Dapat data detail");
    if(!snapshot.exists()){
      kontenDetail.innerHTML = `<p class="loading-text">❌ Produk tidak ditemukan di Firebase</p>`;
      return;
    }
    const item = snapshot.val();
    const hargaAsli = item.hargaAsli || (item.diskon ? Math.round(item.harga * 100 / (100 - item.diskon)) : item.harga);

    // ISI KONTEN DETAIL
    kontenDetail.innerHTML = `
      <img src="${item.foto}" alt="${item.nama}" class="detail-image" onerror="this.src='https://picsum.photos/id/21/400/300'">
      ${item.diskon ? `<span class="diskon-badge">-${item.diskon}%</span>` : ""}
      <h2 class="nama-produk">${item.nama}</h2>
      <div>
        <span class="harga-sekarang">Rp ${Number(item.harga).toLocaleString('id-ID')}</span>
        <span class="harga-lama">Rp ${Number(hargaAsli).toLocaleString('id-ID')}</span>
      </div>
      <p class="info-terjual">${item.terjual || 0} Terjual • Stok: ${item.stok || 0}</p>

      <div id="kartuToko" class="kartu-toko-wrap"><div style="padding:12px;color:#888;font-size:13px">⏳ Memuat toko...</div></div>

      <div class="box-deskripsi">
        <h4>Deskripsi Produk</h4>
        <p>${item.deskripsi || "Tidak ada deskripsi"}</p>
      </div>
    `

    // ===== KARTU TOKO PENJUAL (di atas deskripsi) =====
    function escT(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function kartuTokoHTML(toko, uid, avgRating, jmlProduk, jmlTesti){
      const nama = toko.namaToko || 'Toko BATAM GO';
      const huruf = String(nama).trim().charAt(0).toUpperCase() || '?';
      const ikon = toko.foto ? `<img src="${escT(toko.foto)}" alt="" onerror="this.remove()">` : '';
      const bintang = '<i class="fas fa-star" style="color:#ffb300;font-size:11px"></i>';
      const ratingTxt = jmlTesti > 0
        ? `${avgRating.toFixed(1)} ${bintang} (${jmlTesti} ulasan)`
        : (avgRating>0 ? `${avgRating.toFixed(1)} ${bintang}` : 'Belum ada ulasan');
      return `
        <a href="toko.html?uid=${uid}" class="kartu-toko">
          <div class="kt-ikon"><span class="huruf">${escT(huruf)}</span>${ikon}</div>
          <div class="kt-info">
            <div class="kt-nama">${escT(nama)}</div>
            <div class="kt-rating">${ratingTxt} • ${jmlProduk} produk</div>
          </div>
          <div class="kt-kunjungi"><i class="fas fa-store"></i> Kunjungi</div>
        </a>`;
    }
    if (item.uidPenjual) {
      get(ref(db, 'penjual/' + item.uidPenjual)).then(snap => {
        const wadah = document.getElementById('kartuToko');
        if (!wadah) return;
        if (!snap.exists()) {
          wadah.innerHTML = kartuTokoHTML({ namaToko:'Toko BATAM GO', foto:'' }, item.uidPenjual, 0, 0, 0);
          return;
        }
        const toko = snap.val();
        Promise.all([
          get(ref(db, 'testimoni/' + item.uidPenjual)),
          get(ref(db, 'produk'))
        ]).then(([sT, sP]) => {
          const arrT = sT.val() ? Object.values(sT.val()) : [];
          const avg = arrT.length ? arrT.reduce((s,t)=>s+Number(t.rating||0),0)/arrT.length : Number(toko.rating||0);
          const jmlProduk = sP.val() ? Object.values(sP.val()).filter(p=>p.uidPenjual===item.uidPenjual).length : 0;
          wadah.innerHTML = kartuTokoHTML(toko, item.uidPenjual, avg, jmlProduk, arrT.length);
        }).catch(()=>{
          wadah.innerHTML = kartuTokoHTML(toko, item.uidPenjual, Number(toko.rating||0), 0, 0);
        });
      }).catch(()=>{ const w=document.getElementById('kartuToko'); if(w) w.innerHTML=''; });
    } else {
      const w = document.getElementById('kartuToko');
      if (w) w.innerHTML = '';
    }

    // ✅ HAPUS updateBadgeKeranjang()
    const btnKeranjang = document.getElementById("btnTambahKeranjang");
    btnKeranjang.onclick = function(){
      if (!cekLoginDulu()) return;
      btnKeranjang.disabled = true;
      btnKeranjang.innerText = "Sedang Menambahkan...";

      const keranjangLama = JSON.parse(localStorage.getItem("keranjangToko")) || [];
      const cekSudahAda = keranjangLama.find(x=>x.id === idProduk);

      if(cekSudahAda){
        cekSudahAda.jumlah += 1;
      }else{
        keranjangLama.push({
          id: idProduk,
          nama: item.nama,
          harga: Number(item.harga),
          foto: item.foto,
          uidPenjual: item.uidPenjual || null,
          jumlah: 1
        })
      }

      localStorage.setItem("keranjangToko", JSON.stringify(keranjangLama));

      // 👉 BARIS INI DIHAPUS: updateBadgeKeranjang();
      
      // ✅ TOAST NOTIFIKASI
      const toast = document.getElementById("toastSukses");
      toast.style.display = "block";
      setTimeout(()=>{
        toast.style.display = "none";
        btnKeranjang.disabled = false;
        btnKeranjang.innerHTML = `<i class="fas fa-shopping-cart"></i> Masukkan Keranjang`;
      }, 2000);
    }

     // ✅ BELI SEKARANG
    const btnBeli = document.getElementById("btnBeliSekarang");
    btnBeli.onclick = function(){
      if (!cekLoginDulu()) return;
      const keranjangLama = JSON.parse(localStorage.getItem("keranjangToko")) || [];
      const cekSudahAda = keranjangLama.find(x => x.id === idProduk);

      if(cekSudahAda){
        cekSudahAda.jumlah += 1;
      } else {
        keranjangLama.push({
          id: idProduk,
          nama: item.nama,
          harga: Number(item.harga),
          foto: item.foto,
          uidPenjual: item.uidPenjual || null,
          jumlah: 1
        });
      }

      localStorage.setItem("keranjangToko", JSON.stringify(keranjangLama));

      // Langsung ke checkout
      window.location.href = "checkout.html";
    }
                
  }).catch((err)=>{
    console.error("❌ Error detail:", err);
    kontenDetail.innerHTML = `<p class="loading-text" style="color:red;">❌ Error: ${err.message}</p>`;
  })
}
</script>

<!-- Tombol Aksi -->
<div class="footer-action">
  <button class="btn-keranjang" id="btnTambahKeranjang">
    <i class="fas fa-shopping-cart"></i> Masukkan Keranjang
  </button>
    <button class="btn-beli" id="btnBeliSekarang">
  Beli Sekarang
    </button>
</div>

<div class="toast-sukses" id="toastSukses">✅ Berhasil dimasukkan ke Keranjang!</div>

<!-- BOTTOM NAVIGATION (pembeli) - Beranda aktif karena Detail dicapai dari Beranda/daftar produk -->
<nav class="bottom-nav">
  <a href="index.html" class="active"><i class="fas fa-home"></i><span>Beranda</span></a>
  <a href="produk.html"><i class="fas fa-th-large"></i><span>Kategori</span></a>
  <a href="keranjang.html"><i class="fas fa-shopping-cart"></i><span>Keranjang</span></a>
  <a href="profil.html"><i class="fas fa-user"></i><span>Akun</span></a>
</nav>
</body>
    </html>
