<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF‑8">
  <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
  <meta name="theme‑color" content="#ee4d2d">
  <title>Riwayat Pesanan Saya | Toko Baju Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font‑awesome/6.7.2/css/all.min.css">
  <style>
    * {
      margin:0;
      padding:0;
      box‑sizing:border‑box;
      font‑family:Arial, sans‑serif;
    }
    body {
      background:#f5f5f5;
      padding‑bottom:80px;
    }
    .header {
      background:#ee4d2d;
      color:white;
      padding:14px;
      display:flex;
      align‑items:center;
      gap:12px;
      position:sticky;
      top:0;
    }
    .header a {
      color:white;
      font‑size:20px;
      text‑decoration:none;
    }
    .wrap {
      padding:15px;
    }
    .card‑pesanan {
      background:white;
      border‑radius:8px;
      padding:14px;
      margin‑bottom:12px;
    }
    .status {
      padding:6px 10px;
      border‑radius:4px;
      color:white;
      font‑size:13px;
      display:inline‑block;
      margin‑bottom:8px;
    }
    .status.menunggu {
      background:#f59e0b;
    }
    .status.siapdikirim {
      background:#0d9488;
    }
    .status.dikirim {
      background:#3b82f6;
    }
    .status.selesai {
      background:#22c55e;
    }
    .item‑riwayat {
      display:flex;
      gap:10px;
      margin:8px 0;
      align‑items:center;
    }
    .item‑riwayat img {
      width:60px;
      height:60px;
      object‑fit:cover;
      border‑radius:6px;
    }
    .text‑kosong {
      text‑align:center;
      padding:40px 20px;
      color:#777;
    }
  </style>
</head>
  <body>
  <div class="header">
    <a href="index.html"><i class="fas fa-arrow-left"></i></a>
    <h3>Riwayat Pesanan Saya</h3>
  </div>

  <div class="wrap" id="kontenRiwayat">
    <p style="text-align:center;">Memuat data...</p>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { ref, onValue, update } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const kontenRiwayat = document.getElementById("kontenRiwayat");

    // Konfirmasi pesanan diterima oleh pembeli → status jadi "Selesai".
    // Sync otomatis ke admin.html & seller.html karena keduanya pakai onValue (real-time).
    async function konfirmasiDiterima(idPesanan) {
      if (!confirm('Konfirmasi pesanan ini sudah kamu terima?\n\nStatus akan berubah jadi "Selesai", dan admin + penjual akan otomatis melihat pesanan selesai.')) return;
      try {
        await update(ref(db, "pesanan/" + idPesanan), {
          status: "Selesai",
          diterimaPada: Date.now()
        });
        alert('✅ Pesanan dikonfirmasi diterima!\nStatus sekarang: Selesai.\nAdmin & penjual sudah melihat update ini.');
      } catch (err) {
        alert('❌ Gagal konfirmasi: ' + err.message);
      }
    }

    // GATE via onAuthStateChanged: tunggu auth state dikonfirmasi dulu
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        alert('🛒 Silakan login dulu untuk melihat riwayat pesanan.');
        window.location.href = 'auth/login.html';
        return;
      }
      const uidSaya = user.uid;

      if (!kontenRiwayat) {
        console.error("❌ Elemen #kontenRiwayat tidak ketemu!");
        return;
      }

      const pesananRef = ref(db, "pesanan");

      onValue(pesananRef, (snapshot) => {
        const data = snapshot.val();
        kontenRiwayat.innerHTML = "";

        if (!data) {
          kontenRiwayat.innerHTML = `
            <div class="text-kosong">
              <i class="fas fa-clipboard-list fa-3x"></i>
              <p>Belum ada riwayat pesanan</p>
            </div>`;
          return;
        }

        const listPesanan = Object.entries(data)
          .map(([id, value]) => ({ id, ...value }))
          .filter(p => p.uidPembeli === uidSaya) // hanya pesanan milik user login
          .reverse(); // pesanan terbaru di atas

      if (listPesanan.length === 0) {
        kontenRiwayat.innerHTML = `
          <div class="text-kosong">
            <i class="fas fa-clipboard-list fa-3x"></i>
            <p>Belum ada pesanan. Yuk belanja dulu!</p>
          </div>`;
        return;
      }

      kontenRiwayat.innerHTML = listPesanan.map((pesan, idx) => {
  let kelasStatus = "menunggu";
  if (pesan.status === "Siap Dikirim") kelasStatus = "siapdikirim";
  if (pesan.status === "Sedang Dikirim") kelasStatus = "dikirim";
  if (pesan.status === "Selesai")        kelasStatus = "selesai";

  let htmlBarang = "";
  if (pesan.barang) {
    const daftarBarang = Array.isArray(pesan.barang)
      ? pesan.barang
      : Object.values(pesan.barang);

    htmlBarang = daftarBarang.map(brg => `
      <div style="display:flex;align-items:center;gap:10px;margin:8px 0;">
        <img src="${brg.foto || 'https://picsum.photos/id/21/100/100'}" alt="${brg.nama || ''}"
             style="width:64px;height:64px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#f5f5f5;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:14px;line-height:1.3;word-break:break-word;">${brg.nama || '(Tanpa nama)'}</div>
          <div style="font-size:12px;color:#888;">Qty: ${brg.jumlah || 1}</div>
        </div>
      </div>
    `).join('');
  } else {
    htmlBarang = `<p style="color:#999;">Data barang kosong</p>`;
  }

  const total   = Number(pesan.totalBayar || 0).toLocaleString('id-ID');
  const status  = pesan.status || "-";
  const tanggal = pesan.tanggal || "-";

  // DEBUG: border warna berbeda per kartu supaya batasnya kelihatan jelas
  const warna = ['red','blue','green','orange','purple','brown','teal'][idx % 7];

  // Tombol "Pesanan Sudah Diterima" muncul HANYA saat status Sedang Dikirim.
  // Klik → status jadi "Selesai" + catat diterimaPada → sync ke admin & penjual (real-time via onValue).
  let htmlAksiDiterima = '';
  if (status === 'Sedang Dikirim') {
    htmlAksiDiterima = `
      <button class="btn-diterima" data-id="${pesan.id}"
        style="display:block;width:100%;margin-top:12px;padding:12px;background:#28a745;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">
        <i class="fas fa-check-circle"></i> Pesanan Sudah Diterima
      </button>
    `;
  } else if (status === 'Selesai' && pesan.diterimaPada) {
    const tglDiterima = new Date(pesan.diterimaPada).toLocaleString('id-ID');
    htmlAksiDiterima = `
      <div style="margin-top:10px;padding:8px 10px;background:#eafaf1;border-radius:6px;font-size:12px;color:#1e8e4e;">
        <i class="fas fa-check-circle"></i> Diterima pada: ${tglDiterima}
      </div>
    `;
  }

  return `
    <section style="display:block;border:2px solid ${warna};border-radius:8px;padding:12px;margin:0 0 12px 0;background:white;">
      <span class="status ${kelasStatus}">${status}</span>
      <div><small>Tanggal: ${tanggal}</small></div>
      ${htmlBarang}
      <hr style="margin:8px 0;border:none;border-top:1px solid #eee;">
      <div><strong>Total Bayar: Rp ${total}</strong></div>
      ${htmlAksiDiterima}
    </section>
  `;
}).join('');

      // Pasang handler tombol "Pesanan Sudah Diterima"
      kontenRiwayat.querySelectorAll('.btn-diterima').forEach(btn => {
        btn.addEventListener('click', () => konfirmasiDiterima(btn.dataset.id));
      });

        console.log("✅ Riwayat pesanan dimuat:", listPesanan.length, "item");
      }, (error) => {
        // Callback error — supaya kegagalan tidak diam-diam
        console.error("❌ GAGAL BACA RIWAYAT PESANAN:", error);
        kontenRiwayat.innerHTML = `
          <p style="text-align:center;padding:20px;color:#dc3545;">
            ⚠️ Gagal memuat riwayat pesanan: ${error.message}<br>
            <small>Cek Firebase Rules: pesanan: { ".read": true, ".write": true }</small>
          </p>`;
      });
    });
  </script>
</body>
</html>
