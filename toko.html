<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#43a047">
  <title>Toko Penjual | BATAM GO</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <!-- style.css global: reuse .products-grid, .product-card, .bottom-nav, theme vars -->
  <link rel="stylesheet" href="style.css">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
    body { background:#eef6fc; padding-bottom:70px; }

    .header-toko {
      background:linear-gradient(135deg,#e53935,#fb8c00 55%,#43a047);
      color:white; padding:14px; display:flex; align-items:center; gap:12px;
      position:sticky; top:0; z-index:99;
    }
    .header-toko a { color:white; font-size:20px; text-decoration:none; }
    .header-toko h3 { font-size:17px; }

    .wrap-toko { padding:15px; }

    /* ===== KARTU PROFIL TOKO ===== */
    .profil-toko {
      background:white; border-radius:10px; padding:16px; margin-bottom:16px;
      display:flex; gap:14px; align-items:center;
    }
    .ikon-toko {
      width:64px; height:64px; border-radius:50%;
      background:linear-gradient(135deg,#e53935,#fb8c00 55%,#43a047);
      color:white; flex-shrink:0; position:relative; overflow:hidden;
    }
    .ikon-toko .huruf {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:26px; font-weight:bold;
    }
    .ikon-toko .huruf i { font-size:24px; }
    .ikon-toko img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .info-toko { flex:1; min-width:0; }
    .info-toko h2 { font-size:18px; margin-bottom:2px; word-break:break-word; }
    .info-toko .pemilik { font-size:12px; color:#888; margin-bottom:6px; }
    .rating-bar { display:flex; align-items:center; gap:6px; font-size:14px; flex-wrap:wrap; }
    .rating-bar .bintang { color:#ffb300; letter-spacing:1px; font-size:13px; }
    .rating-bar .bintang .kosong { color:#ddd; }
    .rating-bar .angka { font-weight:bold; color:#333; }
    .rating-bar .count { color:#888; font-size:12px; }
    .stat-row { display:flex; gap:14px; margin-top:8px; font-size:12px; color:#666; flex-wrap:wrap; }
    .stat-row span i { color:#43a047; margin-right:3px; }

    .deskripsi-toko { background:white; border-radius:10px; padding:14px; margin-bottom:16px; }
    .deskripsi-toko h4 { margin-bottom:6px; font-size:14px; }
    .deskripsi-toko p { font-size:13px; color:#555; line-height:1.5; }

    .section-title {
      font-size:15px; font-weight:bold; margin:18px 0 10px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .section-title .count { font-size:12px; color:#888; font-weight:normal; }

    /* ===== TESTIMONI ===== */
    .testimoni-card { background:white; border-radius:10px; padding:12px; margin-bottom:10px; }
    .testimoni-card .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px; }
    .testimoni-card .nama { font-weight:bold; font-size:14px; word-break:break-word; }
    .testimoni-card .bintang { color:#ffb300; font-size:12px; white-space:nowrap; }
    .testimoni-card .bintang .kosong { color:#ddd; }
    .testimoni-card .isi { font-size:13px; color:#555; line-height:1.5; word-break:break-word; }
    .testimoni-card .tgl { font-size:11px; color:#aaa; margin-top:6px; }

    .kosong-section {
      background:white; border-radius:10px; padding:24px; text-align:center;
      color:#999; font-size:13px;
    }
    .kosong-section i { display:block; font-size:32px; color:#ccc; margin-bottom:8px; }

    /* ===== FORM TESTIMONI ===== */
    .form-testimoni { background:white; border-radius:10px; padding:14px; margin-bottom:14px; }
    .form-testimoni h4 { margin-bottom:10px; font-size:14px; }
    .star-input { display:flex; gap:4px; margin-bottom:10px; font-size:26px; }
    .star-input i { color:#ddd; cursor:pointer; transition:color .15s; }
    .star-input i.aktif { color:#ffb300; }
    .form-testimoni textarea {
      width:100%; border:1px solid #ddd; border-radius:6px; padding:10px;
      font-size:13px; resize:vertical; min-height:70px; font-family:inherit;
    }
    .form-testimoni button {
      margin-top:10px; background:linear-gradient(135deg,#e53935,#fb8c00 55%,#43a047);
      color:white; border:none; padding:10px 18px; border-radius:6px; font-size:14px; cursor:pointer;
    }
    .form-testimoni button:disabled { opacity:.6; cursor:wait; }
    .form-testimoni .login-hint { font-size:13px; color:#666; line-height:1.6; }
    .form-testimoni .login-hint a { color:#2196f3; text-decoration:none; font-weight:bold; }

    .toast {
      position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
      background:#22c55e; color:white; padding:12px 20px; border-radius:8px;
      z-index:9999; display:none; font-size:14px;
    }
    .loading { text-align:center; padding:40px; color:#888; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header-toko">
    <a href="index.html" onclick="if(history.length>1){history.back();return false;}"><i class="fas fa-arrow-left"></i></a>
    <h3>Toko Penjual</h3>
  </div>

  <div class="wrap-toko" id="kontenToko">
    <p class="loading">⏳ Memuat toko...</p>
  </div>

  <div class="toast" id="toast">✅ Testimoni terkirim! Memuat ulang...</div>

  <!-- BOTTOM NAVIGATION (pembeli) -->
  <nav class="bottom-nav">
    <a href="index.html"><i class="fas fa-home"></i><span>Beranda</span></a>
    <a href="produk.html"><i class="fas fa-th-large"></i><span>Kategori</span></a>
    <a href="keranjang.html"><i class="fas fa-shopping-cart"></i><span>Keranjang</span></a>
    <a href="profil.html"><i class="fas fa-user"></i><span>Akun</span></a>
  </nav>

<script type="module">
import { auth, db } from './firebase-config.js';
import { ref, get, push, set } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

const urlParams = new URLSearchParams(window.location.search);
const uidToko = urlParams.get('uid');
const konten  = document.getElementById('kontenToko');

// ===== HELPERS =====
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function bintangHTML(rating){
  const r = Math.round(Number(rating)||0);
  let s = '';
  for(let i=1;i<=5;i++){ s += `<i class="fas fa-star ${i<=r?'':'kosong'}"></i>`; }
  return s;
}
function formatTanggal(ts){
  if(!ts) return '';
  try { return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); }
  catch(e){ return ''; }
}
function inisial(nama){
  const t = String(nama||'').trim();
  if(!t) return '<i class="fas fa-store"></i>';
  return esc(t.charAt(0).toUpperCase());
}

// ===== RENDER KARTU PRODUK (reuse class style.css) =====
function kartuProduk(item){
  const harga  = Number(item.harga||0);
  const diskon = Number(item.diskon||0);
  const hargaAsli = item.hargaAsli || (diskon ? Math.round(harga*100/(100-diskon)) : harga);
  const foto   = item.foto || 'https://picsum.photos/id/21/400/400';
  const nama   = item.nama || '(Tanpa nama)';
  const terjual= Number(item.terjual||0);
  const badgeDiskon = diskon ? `<span class="product-discount">-${diskon}%</span>` : '';
  const hargaCoret  = (diskon && hargaAsli!==harga) ? `<small>Rp ${hargaAsli.toLocaleString('id-ID')}</small>` : '';
  return `
    <a href="detail.html?id=${esc(item.id)}" class="product-card">
      <div class="product-image-wrapper">
        <img src="${esc(foto)}" alt="${esc(nama)}" class="product-image"
             onerror="this.onerror=null;this.src='https://picsum.photos/id/21/400/400'">
        ${badgeDiskon}
      </div>
      <div class="product-info">
        <h3 class="product-name">${esc(nama)}</h3>
        <p class="product-price">Rp ${harga.toLocaleString('id-ID')} ${hargaCoret}</p>
        <p class="product-sold">${terjual.toLocaleString('id-ID')} Terjual</p>
      </div>
    </a>`;
}

function renderListTestimoni(arr){
  if(!arr.length){
    return `<div class="kosong-section"><i class="fas fa-comment-dots"></i>Belum ada testimoni. Jadilah yang pertama!</div>`;
  }
  const urut = [...arr].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  return urut.map(t => `
    <div class="testimoni-card">
      <div class="head">
        <span class="nama">${esc(t.namaPenulis||'Pembeli')}</span>
        <span class="bintang">${bintangHTML(t.rating)}</span>
      </div>
      <div class="isi">${esc(t.komentar||'')}</div>
      <div class="tgl">${formatTanggal(t.timestamp)}</div>
    </div>`).join('');
}

// ===== MUAT SEMUA DATA (paralel) =====
if(!uidToko){
  konten.innerHTML = '<p class="loading">❌ Tidak ada ID toko di link</p>';
} else {
  Promise.all([
    get(ref(db, 'penjual/' + uidToko)),
    get(ref(db, 'users/' + uidToko)).catch(()=>null),   // non-fatal: users mungkin private
    get(ref(db, 'testimoni/' + uidToko)).catch(()=>null),  // non-fatal: testimoni mungkin belum ada rule-nya
    get(ref(db, 'produk'))
  ]).then(([snapPenjual, snapUser, snapTestimoni, snapProduk]) => {
    if(!snapPenjual.exists()){
      konten.innerHTML = '<p class="loading">❌ Toko tidak ditemukan</p>';
      return;
    }
    const toko     = snapPenjual.val();
    const pemilik  = (snapUser && snapUser.val()) || {};
    const allTesti = (snapTestimoni && snapTestimoni.val()) || {};
    const allProduk= snapProduk.val() || {};

    const arrTesti = Object.entries(allTesti).map(([k,v])=>({id:k,...v}));
    const jumlahTesti = arrTesti.length;
    const avgRating = jumlahTesti
      ? arrTesti.reduce((s,t)=>s+Number(t.rating||0),0)/jumlahTesti
      : Number(toko.rating||0);

    const produkToko = Object.entries(allProduk)
      .map(([k,v])=>({id:k,...v}))
      .filter(p => p.uidPenjual === uidToko);

    // Ikon toko: huruf inisial sbg background, foto di atas (jika ada & valid)
    const ikonHTML = `<span class="huruf">${inisial(toko.namaToko)}</span>`
      + (toko.foto ? `<img src="${esc(toko.foto)}" alt="" onerror="this.remove()">` : '');

    const ratingHTML = jumlahTesti
      ? `<span class="bintang">${bintangHTML(avgRating)}</span><span class="angka">${avgRating.toFixed(1)}</span><span class="count">(${jumlahTesti} ulasan)</span>`
      : (avgRating>0
          ? `<span class="bintang">${bintangHTML(avgRating)}</span><span class="angka">${avgRating.toFixed(1)}</span>`
          : `<span class="count">Belum ada ulasan</span>`);

    konten.innerHTML = `
      <div class="profil-toko">
        <div class="ikon-toko">${ikonHTML}</div>
        <div class="info-toko">
          <h2>${esc(toko.namaToko||'Toko Tanpa Nama')}</h2>
          <div class="pemilik">Pemilik: ${esc(pemilik.nama||'-')}</div>
          <div class="rating-bar">${ratingHTML}</div>
          <div class="stat-row">
            <span><i class="fas fa-box"></i>${produkToko.length} Produk</span>
            <span><i class="fas fa-fire"></i>${Number(toko.totalTerjual||0)} Terjual</span>
            <span><i class="fas fa-calendar"></i>Bergabung ${formatTanggal(toko.bergabungPada)}</span>
          </div>
        </div>
      </div>

      ${toko.deskripsi ? `<div class="deskripsi-toko"><h4>Tentang Toko</h4><p>${esc(toko.deskripsi)}</p></div>` : ''}

      <div class="section-title">Produk Toko <span class="count">${produkToko.length} produk</span></div>
      ${produkToko.length
        ? `<div class="products-grid">${produkToko.map(kartuProduk).join('')}</div>`
        : `<div class="kosong-section"><i class="fas fa-box-open"></i>Toko belum punya produk</div>`}

      <div class="section-title">Testimoni Pembeli <span class="count">${jumlahTesti} ulasan</span></div>
      <div id="wadahFormTestimoni"></div>
      <div id="wadahTestimoni">${renderListTestimoni(arrTesti)}</div>
    `;

    renderFormTestimoni();
  }).catch(err => {
    console.error('❌ Error muat toko:', err);
    konten.innerHTML = `<p class="loading" style="color:red">❌ Gagal memuat toko: ${esc(err.message)}</p>`;
  });
}

// ===== FORM TESTIMONI (auth-aware) =====
let ratingDipilih = 5;

function renderFormTestimoni(){
  const wadah = document.getElementById('wadahFormTestimoni');
  if(!wadah) return;
  onAuthStateChanged(auth, (user) => {
    if(!user){
      wadah.innerHTML = `<div class="form-testimoni"><h4>Tulis Testimoni</h4>
        <p class="login-hint"><i class="fas fa-sign-in-alt"></i> <a href="auth/login.html">Login dulu</a> untuk meninggalkan testimoni.</p></div>`;
      return;
    }
    if(user.uid === uidToko){
      wadah.innerHTML = `<div class="form-testimoni"><h4>Tulis Testimoni</h4>
        <p class="login-hint">Anda tidak bisa memberi testimoni untuk toko sendiri.</p></div>`;
      return;
    }
    wadah.innerHTML = `
      <div class="form-testimoni">
        <h4>Tulis Testimoni</h4>
        <div class="star-input" id="starInput">
          ${[1,2,3,4,5].map(v=>`<i class="fas fa-star ${v<=ratingDipilih?'aktif':''}" data-val="${v}"></i>`).join('')}
        </div>
        <textarea id="komentarTesti" placeholder="Bagikan pengalaman belanja di toko ini..." maxlength="500"></textarea>
        <button id="btnKirimTesti"><i class="fas fa-paper-plane"></i> Kirim Testimoni</button>
      </div>`;
    const starEls = wadah.querySelectorAll('#starInput i');
    starEls.forEach(el => el.addEventListener('click', () => {
      ratingDipilih = Number(el.dataset.val);
      starEls.forEach(s => s.classList.toggle('aktif', Number(s.dataset.val)<=ratingDipilih));
    }));
    document.getElementById('btnKirimTesti').addEventListener('click', kirimTestimoni);
  });
}

async function kirimTestimoni(){
  const user = auth.currentUser;
  if(!user){ alert('Silakan login dulu.'); window.location.href='auth/login.html'; return; }
  const komentar = (document.getElementById('komentarTesti').value||'').trim();
  if(!komentar){ alert('Komentar tidak boleh kosong.'); return; }
  if(komentar.length > 500){ alert('Komentar maksimal 500 karakter.'); return; }

  const btn = document.getElementById('btnKirimTesti');
  btn.disabled = true; btn.innerText = 'Mengirim...';
  try {
    // Ambil nama penulis (Google displayName atau users/{uid}.nama)
    let namaPenulis = user.displayName || '';
    if(!namaPenulis){
      const snapU = await get(ref(db, 'users/' + user.uid));
      namaPenulis = (snapU.val() && snapU.val().nama) || user.email || 'Pembeli';
    }
    // push testimoni baru ke testimoni/{uidToko}/{autoId}
    const baruRef = push(ref(db, 'testimoni/' + uidToko));
    await set(baruRef, {
      uidPenulis: user.uid,
      namaPenulis: namaPenulis,
      rating: ratingDipilih,
      komentar: komentar,
      timestamp: Date.now()
    });
    // toast lalu reload (fresh rating + list)
    const toast = document.getElementById('toast');
    toast.style.display = 'block';
    setTimeout(()=>{ toast.style.display='none'; location.reload(); }, 1200);
  } catch(e){
    console.error('❌ Gagal kirim testimoni:', e);
    alert('Gagal mengirim testimoni: ' + (e.message||e));
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Kirim Testimoni';
  }
}
</script>
</body>
</html>
