<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEBUG Auth - BATAM GO</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background:#eef6fc; padding: 16px; color: #333; }
    .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
    h1 { font-size: 18px; margin-bottom: 6px; }
    h2 { font-size: 14px; margin-bottom: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .field input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .btn { height: 42px; background:linear-gradient(135deg,#e53935,#fb8c00 55%,#43a047); color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; font-family: "SF Mono", Consolas, monospace; line-height: 1.5; }
    .status-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px; }
    .status-row:last-child { border-bottom: none; }
    .status-row .label { color: #666; }
    .status-row .value { font-weight: 600; text-align: right; word-break: break-all; max-width: 65%; }
    .ok { color: #28a745; }
    .err { color: #dc3545; }
    .warn { color: #ffc107; }
    .mono { font-family: "SF Mono", Consolas, monospace; font-size: 12px; }
    .hint { font-size: 12px; color: #888; margin-top: 8px; line-height: 1.5; }
  </style>
</head>
<body>

<div class="card">
  <h1>🔧 Debug Auth - Batam Go Online Shopping</h1>
  <p class="hint">Halaman ini untuk melihat persis apa yang terjadi saat login. Login di sini, lalu copy semua teks di kotak hitam di bawah ke chat.</p>
</div>

<div class="card" id="cardLogin">
  <h2>Login untuk debug</h2>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="admin@toko.com">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>
  <button class="btn" id="btnLogin">Login &amp; Debug</button>
</div>

<div class="card" id="cardHasil" style="display:none;">
  <h2>Hasil debug</h2>
  <div id="statusBox"></div>
</div>

<div class="card">
  <h2>Log lengkap (copy semuanya ke chat)</h2>
  <pre id="logBox">⏳ Menunggu login...</pre>
</div>

<script type="module">
  import { auth, db } from '../firebase-config.js';
  import { signInWithEmailAndPassword, signOut, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
  import { ref, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

  const logLines = [];
  function log(msg, type = 'info') {
    const prefix = type === 'err' ? '❌ ' : type === 'warn' ? '⚠️ ' : type === 'ok' ? '✅ ' : 'ℹ️ ';
    const line = prefix + msg;
    logLines.push(line);
    document.getElementById('logBox').textContent = logLines.join('\n');
    console.log(line);
  }

  function setStatus(html) {
    document.getElementById('statusBox').innerHTML = html;
  }

  const btn = document.getElementById('btnLogin');
  const emailInp = document.getElementById('email');
  const passInp = document.getElementById('password');

  // Kalau user sudah login saat halaman dibuka, langsung debug
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      log('Saat halaman dibuka, user sudah login: ' + user.uid, 'ok');
      await jalankanDebug(user.uid, user.email);
    }
  });

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.innerText = 'Memproses...';
    logLines.length = 0;
    document.getElementById('logBox').textContent = '⏳ Memproses login...';
    document.getElementById('cardHasil').style.display = 'block';

    const email = emailInp.value.trim();
    const pass = passInp.value;

    if (!email || !pass) {
      log('Email/password kosong', 'err');
      btn.disabled = false;
      btn.innerText = 'Login & Debug';
      return;
    }

    try {
      log('1. Mencoba signInWithEmailAndPassword...');
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      log('2. Login Firebase Auth BERHASIL', 'ok');
      log('3. UID dari Auth: ' + JSON.stringify(cred.user.uid));
      log('   Panjang UID: ' + cred.user.uid.length + ' karakter');
      log('   Email: ' + cred.user.email);
      await jalankanDebug(cred.user.uid, cred.user.email);
    } catch (err) {
      log('❌ Login GAGAL: ' + (err.code || '') + ' - ' + err.message, 'err');
      setStatus('<div class="status-row"><span class="label">Login gagal</span><span class="value err">' + (err.code || err.message) + '</span></div>');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Login & Debug';
    }
  });

  async function jalankanDebug(uid, email) {
    log('', 'info');
    log('=== MULAI DEBUG DATABASE ===');
    log('UID yang akan dicek: ' + JSON.stringify(uid));
    log('Panjang UID: ' + uid.length);

    // Tes 1: baca users/{uid}/role (path yang dipakai auth-guard.js)
    log('', 'info');
    log('TES 1: Baca users/{uid}/role');
    try {
      const snap1 = await get(ref(db, 'users/' + uid + '/role'));
      log('  Path: users/' + uid + '/role');
      log('  Snapshot exists? ' + snap1.exists(), snap1.exists() ? 'ok' : 'warn');
      log('  Value: ' + JSON.stringify(snap1.val()));
    } catch (err) {
      log('  ERROR baca role: ' + err.code + ' - ' + err.message, 'err');
    }

    // Tes 2: baca users/{uid} (node utuh)
    log('', 'info');
    log('TES 2: Baca users/{uid} (node utuh)');
    try {
      const snap2 = await get(ref(db, 'users/' + uid));
      log('  Path: users/' + uid);
      log('  Snapshot exists? ' + snap2.exists(), snap2.exists() ? 'ok' : 'warn');
      if (snap2.exists()) {
        log('  Isi: ' + JSON.stringify(snap2.val(), null, 2), 'ok');
      } else {
        log('  → Node users/{uid} TIDAK ADA. Ini penyebab error "belum punya data peran".', 'err');
      }
    } catch (err) {
      log('  ERROR baca node: ' + err.code + ' - ' + err.message, 'err');
    }

    // Tes 3: baca users/ utuh (lihat semua UID yang ada)
    log('', 'info');
    log('TES 3: Baca users/ (semua key)');
    try {
      const snap3 = await get(ref(db, 'users'));
      log('  Path: users');
      log('  Snapshot exists? ' + snap3.exists(), snap3.exists() ? 'ok' : 'warn');
      if (snap3.exists()) {
        const keys = Object.keys(snap3.val() || {});
        log('  Jumlah user di DB: ' + keys.length);
        log('  Semua key (UID) di DB:', 'ok');
        keys.forEach((k, i) => {
          log('    [' + (i+1) + '] ' + JSON.stringify(k) + ' (panjang ' + k.length + ')');
        });
        log('', 'info');
        const uidCocok = keys.includes(uid);
        log('  Apakah UID login ADA di daftar DB? ' + uidCocok, uidCocok ? 'ok' : 'err');
        if (!uidCocok) {
          log('  → INI MASALAHNYA! UID login tidak cocok dengan UID di database.', 'err');
          log('  → Kemungkinan: trailing whitespace, salah copy, atau beda user.', 'err');
        }
      } else {
        log('  → Node users/ KOSONG. Belum ada data user di database sama sekali.', 'err');
      }
    } catch (err) {
      log('  ERROR baca users/: ' + err.code + ' - ' + err.message, 'err');
    }

    log('', 'info');
    log('=== DEBUG SELESAI ===');
    log('Copy SEMUA teks di kotak ini (dari atas sampai bawah) dan paste ke chat.');

    // Tampilkan ringkasan di statusBox
    setStatus(`
      <div class="status-row"><span class="label">Email login</span><span class="value">${email}</span></div>
      <div class="status-row"><span class="label">UID (Auth)</span><span class="value mono">${uid}</span></div>
      <div class="status-row"><span class="label">Panjang UID</span><span class="value">${uid.length} karakter</span></div>
      <div class="status-row"><span class="label">Status</span><span class="value">Lihat log lengkap di bawah ↓</span></div>
    `);
  }
</script>
</body>
</html>
