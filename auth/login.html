<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - BATAM GO</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background:#eef6fc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 12px; padding: clamp(24px, 6vw, 36px); max-width: 380px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo i { font-size: clamp(36px, 10vw, 44px); color:#2e7d46; }
    .logo h1 { font-size: clamp(16px, 4.5vw, 18px); color: #333; margin-top: 8px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
    .field input {
      width: 100%; height: 44px; padding: 0 14px;
      border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none;
    }
    .field input:focus { border-color:#2e7d46; }
    .btn {
      width: 100%; height: 44px; background:linear-gradient(135deg,#e53935,#fb8c00 55%,#43a047); color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #dc3545; font-size: 13px; margin-bottom: 12px; min-height: 18px; text-align: center; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
    .footer-link a { color:#2e7d46; text-decoration: none; }
    .back-home { text-align: center; margin-top: 14px; }
    .back-home a { color: #888; font-size: 13px; text-decoration: none; }
    .divider { display: flex; align-items: center; text-align: center; margin: 16px 0; color: #999; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #eee; }
    .divider span { padding: 0 12px; }
    .btn-google {
      width: 100%; height: 44px; background: #fff; color: #555;
      border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-google:hover { background: #f8f8f8; }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-google i { color: #4285f4; font-size: 16px; }
    .auth-loading { position: fixed; inset: 0; background:#eef6fc; display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; }
    .auth-loading i { font-size: 32px; color:#2e7d46; animation: spin 1s linear infinite; }
    .auth-loading p { margin-top: 12px; color: #666; font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="auth-loading" id="authLoading">
    <i class="fas fa-spinner"></i>
    <p>Memeriksa login...</p>
  </div>
  <div class="card">
    <div class="logo">
      <i class="fas fa-shopping-bag"></i>
      <h1>Batam Go Online Shopping</h1>
    </div>
    <form id="formLogin">
      <div class="error" id="msgError"></div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="email@contoh.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="btnLogin">Masuk</button>
      <div class="divider"><span>atau</span></div>
      <button type="button" class="btn-google" id="btnGoogle">
        <i class="fab fa-google"></i> Masuk dengan Google
      </button>
    </form>
    <div class="footer-link">
      Belum punya akun? <a href="register.html">Daftar di sini</a>
    </div>
    <div class="back-home">
      <a href="../index.html"><i class="fas fa-arrow-left"></i> Kembali ke beranda</a>
    </div>
  </div>

  <script type="module">
    import { auth } from '../firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { cekLoginSaatIni, bacaRole, redirectByRole, loginDenganGoogle } from './auth-guard.js';

    // Kalau user sudah login, langsung redirect sesuai role.
    // Kalau belum, sembunyikan overlay loading & tampilkan form login.
    cekLoginSaatIni().then(info => {
      if (info) {
        redirectByRole(info.role);
      } else {
        const overlay = document.getElementById('authLoading');
        if (overlay) overlay.style.display = 'none';
      }
    });

    const form = document.getElementById('formLogin');
    const btn  = document.getElementById('btnLogin');
    const err  = document.getElementById('msgError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.innerText = '';
      btn.disabled = true;
      btn.innerText = 'Memproses...';
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const role = await bacaRole(cred.user.uid);
        if (!role) {
          err.innerText = 'Akun belum punya data peran. Hubungi admin.';
          btn.disabled = false;
          btn.innerText = 'Masuk';
          return;
        }
        redirectByRole(role);
      } catch (e2) {
        err.innerText = terjemahanError(e2.code) || 'Email atau password salah.';
        btn.disabled = false;
        btn.innerText = 'Masuk';
      }
    });

    // === LOGIN DENGAN GOOGLE ===
    const btnGoogle = document.getElementById('btnGoogle');
    if (btnGoogle) {
      btnGoogle.addEventListener('click', async () => {
        btnGoogle.disabled = true;
        err.innerText = '';
        try {
          const info = await loginDenganGoogle('pembeli');
          redirectByRole(info.role);
        } catch (e) {
          err.innerText = 'Gagal login Google: ' + (e.message || e.code || 'tidak diketahui');
          btnGoogle.disabled = false;
        }
      });
    }

    function terjemahanError(code) {
      const map = {
        'auth/invalid-email': 'Format email tidak valid.',
        'auth/user-disabled': 'Akun ini dinonaktifkan.',
        'auth/user-not-found': 'Email belum terdaftar.',
        'auth/wrong-password': 'Email atau password salah.',
        'auth/invalid-credential': 'Email atau password salah.',
        'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.'
      };
      return map[code];
    }
  </script>
</body>
</html>
