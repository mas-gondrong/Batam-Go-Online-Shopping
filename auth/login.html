<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Toko Baju Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #fff; border-radius: 12px; padding: clamp(24px, 6vw, 36px); max-width: 380px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .logo { text-align: center; margin-bottom: 24px; }
    .logo i { font-size: clamp(36px, 10vw, 44px); color: #ee4d2d; }
    .logo h1 { font-size: clamp(16px, 4.5vw, 18px); color: #333; margin-top: 8px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
    .field input {
      width: 100%; height: 44px; padding: 0 14px;
      border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none;
    }
    .field input:focus { border-color: #ee4d2d; }
    .btn {
      width: 100%; height: 44px; background: #ee4d2d; color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #dc3545; font-size: 13px; margin-bottom: 12px; min-height: 18px; text-align: center; }
    .footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #666; }
    .footer-link a { color: #ee4d2d; text-decoration: none; }
    .back-home { text-align: center; margin-top: 14px; }
    .back-home a { color: #888; font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <i class="fas fa-shopping-bag"></i>
      <h1>Toko Baju Online</h1>
    </div>
    <form id="formLogin">
      <div class="error" id="msgError"></div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="email@contoh.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="btnLogin">Masuk</button>
    </form>
    <div class="footer-link">
      Belum punya akun? <a href="register.html">Daftar di sini</a>
    </div>
    <div class="back-home">
      <a href="../index.html"><i class="fas fa-arrow-left"></i> Kembali ke beranda</a>
    </div>
  </div>

  <script type="module">
    import { auth } from '../firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { cekLoginSaatIni, bacaRole, redirectByRole } from './auth-guard.js';

    // Kalau user sudah login, langsung redirect sesuai role
    cekLoginSaatIni().then(info => {
      if (info) redirectByRole(info.role);
    });

    const form = document.getElementById('formLogin');
    const btn  = document.getElementById('btnLogin');
    const err  = document.getElementById('msgError');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.innerText = '';
      btn.disabled = true;
      btn.innerText = 'Memproses...';
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const role = await bacaRole(cred.user.uid);
        if (!role) {
          err.innerText = 'Akun belum punya data peran. Hubungi admin.';
          btn.disabled = false;
          btn.innerText = 'Masuk';
          return;
        }
        redirectByRole(role);
      } catch (e2) {
        err.innerText = terjemahanError(e2.code) || 'Email atau password salah.';
        btn.disabled = false;
        btn.innerText = 'Masuk';
      }
    });

    function terjemahanError(code) {
      const map = {
        'auth/invalid-email': 'Format email tidak valid.',
        'auth/user-disabled': 'Akun ini dinonaktifkan.',
        'auth/user-not-found': 'Email belum terdaftar.',
        'auth/wrong-password': 'Email atau password salah.',
        'auth/invalid-credential': 'Email atau password salah.',
        'auth/too-many-requests': 'Terlalu banyak percobaan. Coba lagi nanti.'
      };
      return map[code];
    }
  </script>
</body>
</html>
