  <!-- Firebase SDK -->
<script type="module" src="firebase-config.js"></script>

<!-- Hubungkan Firebase & Baca Produk (VERSI BENAR) -->
<script type="module">
import { db } from './firebase-config.js';
import { ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const produkRef = ref(db, 'produk');
const container = document.getElementById("daftarProdukBeranda");
const teksLoading = document.getElementById("teksLoading");

// ⚠️ PENGECEKAN JIKA INPUT CARI TIDAK ADA (tidak bikin script mati)
const inputCari = document.getElementById("cariProduk");
const tombolFilter = document.querySelectorAll(".category-item");

let semuaProduk = [];
let kategoriAktif = "semua";

// Muat Produk
onValue(
  produkRef,
  (snapshot) => {
    const data = snapshot.val();
    if(teksLoading) teksLoading.innerText = "✅ Selesai dimuat";

    if (!container) {
      console.error('❌ Container #daftarProdukBeranda TIDAK DITEMUKAN');
      return;
    }

    if (!data) {
      container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;padding:30px;">Belum ada produk di Firebase</p>';
      return;
    }

    semuaProduk = Object.keys(data).map(key => ({
      id: key,
      ...data[key]
    }));

    tampilkanHasil();
  },
  (error) => {
    if(teksLoading) teksLoading.innerText = "❌ Gagal muat produk";
    alert("Error baca Firebase: " + error.message);
    console.error(error);
  }
)

function tampilkanHasil(){
  const kataCari = (inputCari) ? inputCari.value.toLowerCase().trim() : "";
  let hasil = semuaProduk;

  if(kategoriAktif !== "semua"){
    hasil = hasil.filter(p => p.kategori?.toLowerCase() === kategoriAktif)
  }

  if(kataCari){
    hasil = hasil.filter(p => p.nama?.toLowerCase().includes(kataCari))
  }

  if (hasil.length === 0) {
    container.innerHTML = '<p style="grid‑column:1/‑1;text‑align:center;color:#888;padding:30px;">Produk yang dicari tidak ditemukan</p>';
    return;
  }

  const htmlKartu = hasil.map(item => {
    const hargaAsli = item.hargaAsli || (item.diskon
      ? Math.round(item.harga * 100 / (100 ‑ item.diskon))
      : item.harga);

    return `
<a href="detail.html?id=${item.id}" class="product‑card">
  <div class="product‑image‑wrapper">
    <img src="${item.foto}" alt="${item.nama}" class="product‑image" onerror="this.src='https://picsum.photos/id/21/400/300'">
    ${item.diskon ? `<span class="product‑discount">‑${item.diskon}%</span>` : ""}
  </div>
  <div class="product‑info">
    <h3 class="product‑name">${item.nama}</h3>
    <p class="product‑price">
      Rp ${Number(item.harga||0).toLocaleString('id‑ID')}
      <small style="text‑decoration:line‑through;color:#999;">Rp ${Number(hargaAsli).toLocaleString('id‑ID')}</small>
    </p>
    <p class="product‑sold">${item.terjual || 0} Terjual</p>
  </div>
</a>
`
  }).join("");

  container.innerHTML = htmlKartu;
}

// Event Enter Cari (hanya jalan kalau input ada)
if(inputCari){
  inputCari.addEventListener("keyup", (e)=>{
    if(e.key === "Enter") tampilkanHasil();
  })
}

// Event Klik Kategori
tombolFilter.forEach(btn=>{
  btn.addEventListener("click", (e)=>{
    e.preventDefault();
    tombolFilter.forEach(b => b.classList.remove("aktif"));
    btn.classList.add("aktif");
    kategoriAktif = btn.dataset.kategori;
    tampilkanHasil();
  })
})
</script>

  <script>
// FUNGSI UPDATE BADGE KERANJANG (DIPAKAI DI INDEX + BISA DIPANGGIL DARI DETAIL)
function updateBadgeKeranjang(){
  const keranjang = JSON.parse(localStorage.getItem("keranjangToko")) || [];
  // Hitung SEMUA jumlah keseluruhan barang (bukan cuma jumlah item)
  let totalBarang = 0;
  keranjang.forEach(item=> totalBarang += Number(item.jumlah));

  const badge = document.getElementById("badgeKeranjang");
  if(badge){
    badge.innerText = totalBarang;
    // Kalau 0 sembunyikan badge
    badge.style.display = totalBarang === 0 ? "none" : "grid";
  }
}

// Jalankan saat halaman beranda dibuka
window.addEventListener("DOMContentLoaded", updateBadgeKeranjang);
  </script>
