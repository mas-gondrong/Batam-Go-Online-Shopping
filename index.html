<!-- RENDER MODAL AKUN BERDASARKAN STATUS LOGIN -->
<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
  import { ref, get } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";
  import { logout } from './auth/auth-guard.js';

  const akunBody = document.getElementById('akunBody');

  async function renderAkunModal(user) {
    if (!akunBody) return;
    if (!user) {
      // Belum login
      akunBody.innerHTML = `
        <div style="text-align:center;padding:24px 20px;">
          <i class="fas fa-user-circle" style="font-size:52px;color:#ddd;"></i>
          <p style="margin:12px 0 4px;color:#333;font-weight:600;font-size:15px;">Kamu belum login</p>
          <p style="color:#888;font-size:13px;margin-bottom:16px;">Masuk untuk belanja & lihat pesananmu</p>
          <a href="auth/login.html" style="display:block;background:#ee4d2d;color:white;padding:12px;border-radius:8px;text-decoration:none;font-weight:600;font-size:15px;">
            <i class="fas fa-sign-in-alt"></i> Masuk / Daftar
          </a>
        </div>
      `;
      return;
    }

    // Sudah login — baca role & nama dari DB
    let role = 'pembeli';
    let nama = user.displayName || user.email || 'Pengguna';
    try {
      const snap = await get(ref(db, 'users/' + user.uid));
      if (snap.exists()) {
        const d = snap.val();
        if (d.role) role = d.role;
        if (d.nama) nama = d.nama;
      }
    } catch (e) { console.error('Gagal baca role:', e); }

    const roleLabel = { admin: 'Administrator', penjual: 'Penjual', pembeli: 'Pembeli' };
    const roleColor = { admin: '#dc3545', penjual: '#6f42c1', pembeli: '#28a745' };

    let menuTambahan = '';
    if (role === 'admin') {
      menuTambahan += `
        <li><a href="admin.html"><i class="fas fa-cog"></i> Panel Admin</a></li>
      `;
    } else if (role === 'penjual') {
      menuTambahan += `
        <li><a href="seller.html"><i class="fas fa-store"></i> Kelola Produk</a></li>
      `;
    }

    akunBody.innerHTML = `
      <div style="text-align:center;padding:20px;border-bottom:1px solid #f0f0f0;">
        <div style="width:64px;height:64px;border-radius:50%;background:#ee4d2d;color:white;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;margin:0 auto 10px;">
          ${nama.charAt(0).toUpperCase()}
        </div>
        <div style="font-weight:600;color:#333;font-size:15px;word-break:break-word;">${nama}</div>
        <div style="color:#888;font-size:12px;margin:2px 0 8px;word-break:break-all;">${user.email || ''}</div>
        <span style="display:inline-block;padding:3px 12px;border-radius:12px;font-size:11px;font-weight:600;color:white;background:${roleColor[role] || '#28a745'};">${roleLabel[role] || 'Pengguna'}</span>
      </div>
      <ul class="akun-menu">
        <li><a href="profil.html"><i class="fas fa-user"></i> Akun Saya</a></li>
        <li><a href="riwayat.html"><i class="fas fa-shopping-bag"></i> Pesanan Saya</a></li>
        ${menuTambahan}
        <li><a href="#" id="linkLogoutModal"><i class="fas fa-sign-out-alt" style="color:#dc3545;"></i> <span style="color:#dc3545;">Keluar</span></a></li>
      </ul>
    `;

    const linkLogout = document.getElementById('linkLogoutModal');
    if (linkLogout) {
      linkLogout.addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm('Yakin ingin keluar dari akun ini?')) {
          logout();
        }
      });
    }
  }

  // Render saat auth state berubah (login/logout)
  onAuthStateChanged(auth, renderAkunModal);
</script>

<!-- Hubungkan Firebase & Baca Produk (VERSI BENAR) -->
<script type="module">
import { db } from './firebase-config.js';
import { ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const produkRef    = ref(db, 'produk');
const container    = document.getElementById("daftarProdukBeranda");
const inputCari    = document.getElementById("cariProduk");
const tombolFilter = document.querySelectorAll(".category-item");

let semuaProduk   = [];
let kategoriAktif = "semua";

// Listener baca produk dari Firebase
onValue(produkRef, (snapshot) => {
  const data = snapshot.val();

  if (!container) {
    console.error('❌ Container #daftarProdukBeranda TIDAK DITEMUKAN di index.html');
    return;
  }

  if (!data) {
    container.innerHTML =
      '<p style="grid-column:1/-1;text-align:center;color:#888;padding:30px;">Belum ada produk di Firebase</p>';
    return;
  }

  // Simpan semua produk untuk filter & pencarian
  semuaProduk = Object.keys(data).map(key => ({ id: key, ...data[key] }));
  tampilkanHasil();
}, (error) => {
  console.error("❌ GAGAL BACA PRODUK:", error);
  if (container) {
    container.innerHTML =
      '<p style="grid-column:1/-1;text-align:center;color:#dc3545;padding:30px;">⚠️ Gagal memuat produk: ' +
      error.message + '<br><small>Cek Firebase Rules: produk: { ".read": true }</small></p>';
  }
});

// Fungsi utama: filter kategori + cari + render kartu
function tampilkanHasil() {
  if (!container) return;

  const kataCari = (inputCari ? inputCari.value : "").toLowerCase().trim();
  let hasil = semuaProduk;

  // Filter kategori (multi-kategori + auto "diskon" untuk produk yang sedang diskon)
  if (kategoriAktif !== "semua") {
    hasil = hasil.filter(p => {
      // Kategori eksplisit yang dicentang admin saat simpan (array of string)
      let k = p.kategori;
      if (Array.isArray(k)) {
        k = k.map(x => String(x).toLowerCase());
      } else if (typeof k === "string") {
        k = [k.toLowerCase()];
      } else {
        k = [];
      }
      // Bonus: produk dengan diskon > 0 otomatis masuk kategori "diskon"
      // walau admin tidak mencentangnya.
      if (Number(p.diskon) > 0 && !k.includes("diskon")) k.push("diskon");
      return k.includes(kategoriAktif);
    });
  }

  // Filter pencarian real-time
  if (kataCari) {
    hasil = hasil.filter(p => (p.nama || "").toLowerCase().includes(kataCari));
  }

  if (hasil.length === 0) {
    container.innerHTML =
      '<p style="grid-column:1/-1;text-align:center;color:#888;padding:30px;">Produk yang dicari tidak ditemukan</p>';
    return;
  }

  container.innerHTML = hasil.map(item => {
    const harga     = Number(item.harga || 0);
    const diskon    = Number(item.diskon || 0);
    const hargaAsli = item.hargaAsli || (diskon ? Math.round(harga * 100 / (100 - diskon)) : harga);
    const foto      = item.foto || 'https://picsum.photos/id/21/400/400';
    const nama      = item.nama || '(Tanpa nama)';
    const terjual   = Number(item.terjual || 0);

    const badgeDiskon = diskon ? `<span class="product-discount">-${diskon}%</span>` : '';
    const hargaCoret  = (diskon && hargaAsli !== harga)
      ? `<small style="text-decoration:line-through;color:#999;">Rp ${hargaAsli.toLocaleString('id-ID')}</small>`
      : '';

    return `
      <a href="detail.html?id=${item.id}" class="product-card">
        <div class="product-image-wrapper">
          <img src="${foto}" alt="${nama}" class="product-image"
               onerror="this.onerror=null;this.src='https://picsum.photos/id/21/400/400';">
          ${badgeDiskon}
        </div>
        <div class="product-info">
          <h3 class="product-name">${nama}</h3>
          <p class="product-price">Rp ${harga.toLocaleString('id-ID')} ${hargaCoret}</p>
          <p class="product-sold">${terjual.toLocaleString('id-ID')} Terjual</p>
        </div>
      </a>
    `;
  }).join("");

  console.log('✅ Produk beranda dimuat:', hasil.length, 'item');
}

// Pencarian real-time: filter di SETIAP ketikan (bukan hanya saat Enter)
if (inputCari) {
  inputCari.addEventListener("input", tampilkanHasil);
} else {
  console.warn('⚠️ Input #cariProduk tidak ketemu — pencarian tidak akan jalan.');
}

// Klik kategori
tombolFilter.forEach(btn => {
  btn.addEventListener("click", (e) => {
    e.preventDefault(); // cegah navigasi kalau pakai <a href="#">
    tombolFilter.forEach(b => b.classList.remove("aktif"));
    btn.classList.add("aktif");
    kategoriAktif = btn.dataset.kategori || "semua";
    tampilkanHasil();
  });
}); 
</script>

  <script>
// FUNGSI UPDATE BADGE KERANJANG (DIPAKAI DI INDEX + BISA DIPANGGIL DARI DETAIL)
function updateBadgeKeranjang(){
  const keranjang = JSON.parse(localStorage.getItem("keranjangToko")) || [];
  // Hitung SEMUA jumlah keseluruhan barang (bukan cuma jumlah item)
  let totalBarang = 0;
  keranjang.forEach(item=> totalBarang += Number(item.jumlah));

  const badge = document.getElementById("badgeKeranjang");
  if(badge){
    badge.innerText = totalBarang;
    // Kalau 0 sembunyikan badge
    badge.style.display = totalBarang === 0 ? "none" : "grid";
  }
}

// Jalankan saat halaman beranda dibuka
window.addEventListener("DOMContentLoaded", updateBadgeKeranjang);
  </script>

  <!-- ============ TOMBOL INSTALL PWA MENGAMBANG ============ -->
  <style>
    #installBanner {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 4px;
      background: white;
      border-radius: 50px;
      box-shadow: 0 8px 30px rgba(238,77,45,0.45), 0 2px 8px rgba(0,0,0,0.25);
      padding: 6px 6px 6px 18px;
      border: 2px solid #ee4d2d;
      animation: pulseInstall 2.2s ease-in-out infinite;
    }
    #installBanner.show { display: flex; }
    #btnInstallPwa {
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 700; color: #ee4d2d;
      padding: 8px 4px; font-family: Arial, sans-serif;
    }
    #btnInstallPwa i { font-size: 18px; }
    #btnTutupInstall {
      background: #f5f5f5; border: none; cursor: pointer;
      width: 28px; height: 28px; border-radius: 50%;
      font-size: 18px; color: #888; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    #btnTutupInstall:active { background: #eee; }
    @keyframes pulseInstall {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50%      { transform: translate(-50%, -50%) scale(1.06); }
    }
    @media (max-width: 380px) {
      #btnInstallPwa span { font-size: 13px; }
      #installBanner { padding: 5px 5px 5px 14px; }
    }
  </style>

  <div id="installBanner">
    <button id="btnInstallPwa" aria-label="Install aplikasi">
      <i class="fas fa-download"></i><span>Install Aplikasi</span>
    </button>
    <button id="btnTutupInstall" aria-label="Tutup">&times;</button>
  </div>

  <script>
  (function () {
    // === REGISTER SERVICE WORKER (syarat utama PWA bisa di-install) ===
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js')
          .then(function (reg) { console.log('✅ SW terdaftar, scope:', reg.scope); })
          .catch(function (err) { console.warn('⚠️ SW gagal daftar:', err); });
      });
    }

    // === LOGIKA TOMBOL INSTALL ===
    var banner     = document.getElementById('installBanner');
    var btnInstall = document.getElementById('btnInstallPwa');
    var btnTutup   = document.getElementById('btnTutupInstall');
    var deferredPrompt = null;

    // Cek apakah aplikasi sudah terinstall (jalan mode standalone)
    function sudahTerinstall() {
      return window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
    }

    // Tampilkan tombol hanya kalau BELUM install & belum ditutup user sesi ini
    function refreshBanner() {
      if (sudahTerinstall()) { banner.classList.remove('show'); return; }
      if (sessionStorage.getItem('installDitutup') === '1') { banner.classList.remove('show'); return; }
      banner.classList.add('show');
    }
    refreshBanner();

    // Chrome/Android: simpan event install bawaan browser
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      refreshBanner();
    });

    // Klik tombol Install
    btnInstall.addEventListener('click', async function () {
      if (deferredPrompt) {
        // Android/Chrome desktop → tampilkan prompt install resmi
        deferredPrompt.prompt();
        var choice = await deferredPrompt.userChoice;
        if (choice.outcome === 'accepted') console.log('✅ User menginstall');
        deferredPrompt = null;
        banner.classList.remove('show');
      } else {
        // iOS Safari tidak support beforeinstallprompt → arahkan manual
        alert(' Aplikasi hanya bisa di Install melalui Browser Chrome:\n\n1. Tap ikon Share (kotak + panah ke atas) di bawah\n2. Pilih "Tambahkan ke Layar Utama"\n3. Tap "Tambah"\n\nDi Android Chrome: menu ⋮ → "Tambahkan ke Layar Utama".');
      }
    });

    // Tombol tutup (sembunyi sementara untuk sesi ini)
    btnTutup.addEventListener('click', function () {
      sessionStorage.setItem('installDitutup', '1');
      banner.classList.remove('show');
    });

    // Sembunyikan permanen setelah berhasil install
    window.addEventListener('appinstalled', function () {
      sessionStorage.removeItem('installDitutup');
      banner.classList.remove('show');
      console.log('✅ Aplikasi terinstall');
    });
  })();
  </script>
