<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial‑scale=1.0">
  <meta name="theme‑color" content="#ee4d2d">
  <title>Checkout Pesanan | Toko Baju Online</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font‑awesome/6.7.2/css/all.min.css">

  <style>
  * {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans‑serif;
}
body {
  background:#f5f5f5;
  padding‑bottom:90px;
}
.header‑checkout {
  background:#ee4d2d;
  color:white;
  padding:14px;
  display:flex;
  align‑items:center;
  gap:12px;
  position:sticky;
  top:0;
  z‑index:99;
}
.header‑checkout a {
  color:white;
  font‑size:20px;
  text‑decoration:none;
}
.wrap {
  padding:15px;
}
.box {
  background:white;
  border‑radius:8px;
  padding:14px;
  margin‑bottom:12px;
}
.box h4 {
  margin‑bottom:10px;
}
input, textarea {
  width:100%;
  padding:10px;
  margin‑bottom:8px;
  border:1px solid #ddd;
  border‑radius:6px;
}

/* ✅ PERBAIKAN GAMBAR CHECKOUT (INI YANG PERBAIKI FOTO MELEBAR) */
.item‑checkout {
  display:flex;
  gap:10px;
  margin‑bottom:8px;
  align‑items:center;
}
.item‑checkout img {
  width:70px;
  height:70px;
  object‑fit:cover;
  border‑radius:6px;
  flex‑shrink:0; /* JANGAN GAMBAR DIPERKECIL / MEMELEBAR */
}

.row‑harga {
  display:flex;
  justify‑content:space‑between;
  margin:6px 0;
}
.total‑akhir {
  font‑size:18px;
  font‑weight:bold;
  color:#ee4d2d;
}
.btn‑pesan {
  width:100%;
  background:#ee4d2d;
  color:white;
  border:none;
  padding:14px;
  border‑radius:8px;
  font‑size:16px;
}

    .item-checkout {
  display:flex;
  gap:10px;
  margin‑bottom:8px;
  align‑items:center;
}
.item-checkout img {
  width:70px;
  height:70px;
  object‑fit:cover;
  border‑radius:6px;
  flex‑shrink:0;
}
#toastCheckout{
  position:fixed;
  bottom:130px;
  left:50%;
  transform:translateX(-50%);
  background‑color:#22c55e;
  color:#ffffff;
  padding:14px 22px;
  border‑radius:8px;
  z‑index:9999;
  display:none;
  max‑width:90%;
  text‑align:center;
}


/* ✅ CSS TOAST (WAJIB ADA UNTUK NOTIF HIJAU) */
#toastCheckout{
  position:fixed;
  bottom:130px;
  left:50%;
  transform:translateX(-50%);
  background‑color:#22c55e;
  color:#ffffff;
  padding:14px 22px;
  border‑radius:8px;
  z‑index:9999;
  display:none;
  max‑width:90%;
  text‑align:center;
}

    /* =====================================
   BOTTOM NAVIGATION
===================================== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #ee4d2d;
  display: flex;
  justify-content: space-around;
  padding: 6px 0;
  box-shadow: 0 -1px 4px rgba(0,0,0,0.06);
  z-index: 100;
}

.bottom-nav a {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 11px;
  color: var(--gray);
  padding: 4px 10px;
}

.bottom-nav a i {
  font-size: 18px;
  margin-bottom: 2px;
}

.bottom-nav a.active {
  color: var(--primary);
}
  </style>
</head>
<body>
  <div class="header‑checkout">
    <a href="keranjang.html"><i class="fas fa‑arrow‑left"></i></a>
    <h3>Checkout Pesanan</h3>
  </div>

  <div class="wrap">
    <!-- ALAMAT PENERIMA -->
    <div class="box">
      <h4>Alamat Penerima</h4>
      <input type="text" id="namaPenerima" placeholder="Nama Lengkap">
      <input type="text" id="noHp" placeholder="Nomor HP">
      <textarea id="alamatLengkap" rows="3" placeholder="Alamat lengkap (Jalan, RT RW, Kota)"></textarea>
    </div>
    
    <!-- DAFTAR BARANG -->
    <div class="box">
      <h4>Daftar Barang</h4>
      <div id="daftarBarangCheckout"></div>
    </div>

    <!-- RINCIAN BIAYA -->
<div class="box">
  <div class="row-harga">
    <span>Subtotal</span>
    <span id="subtotalText">Rp 0</span>
  </div>
  <div class="row-harga">
    <span>Ongkir</span>
    <span id="ongkirText">Rp 15.000</span>
  </div>
  <div class="row-harga total-akhir">
    <span>Total Bayar</span>
    <span id="totalAkhirText">Rp 0</span>
  </div>
</div>

<button class="btn-pesan" id="btnKirimPesanan">Kirim Pesanan Ke Penjual</button>
</div>

<div class="toast-sukses" id="toastCheckout">✅ Pesanan Berhasil Dikirim!</div>

  <!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
  <a href="index.html" class="active">
    <i class="fas fa-home"></i>
    <span>Beranda</span>
  </a>
  <a href="produk.html">
    <i class="fas fa-th-large"></i>
    <span>Kategori</span>
  </a>
  <a href="keranjang.html">
    <i class="fas fa-shopping-cart"></i>
    <span>Keranjang</span>
  </a>
  <a href="#" onclick="bukaAkun(); return false;" class="active">
  <i class="fas fa-user"></i>
  <span>Akun</span>
  </a>
</nav>
  
<!-- FIREBASE -->
<script type="module" src="firebase-config.js"></script>
<script type="module">
import { db } from './firebase-config.js';
import { ref, push } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

const ONGKIR = 15000;
const wadahBarang = document.getElementById("daftarBarangCheckout");
const subtotalText = document.getElementById("subtotalText");
const totalAkhirText = document.getElementById("totalAkhirText");
const btnKirim = document.getElementById("btnKirimPesanan");

// Muat keranjang
function muatCheckout(){
  const keranjang = JSON.parse(localStorage.getItem("keranjangToko")) || [];
  if(keranjang.length === 0){
    wadahBarang.innerText = "Keranjang kosong, silakan belanja dulu";
    subtotalText.innerText = "Rp 0";
    totalAkhirText.innerText = "Rp 0";
    return;
  }
  let subtotal = 0;
  wadahBarang.innerHTML = "";
  keranjang.forEach(item=>{
    const sub = Number(item.harga) * Number(item.jumlah);
    subtotal += sub;
    wadahBarang.innerHTML += `
    <div class="item-checkout">
      <img src="${item.foto}">
      <div>
        <div>${item.nama}</div>
        <div>Qty: ${item.jumlah} | Rp ${Number(item.harga).toLocaleString('id-ID')}</div>
      </div>
    </div>
    `
  })
  subtotalText.innerText = "Rp " + subtotal.toLocaleString('id-ID');
  const totalAkhir = subtotal + ONGKIR;
  totalAkhirText.innerText = "Rp " + totalAkhir.toLocaleString('id-ID');
}

// KLIK TOMBOL KIRIM
btnKirim.addEventListener("click", async function(){
  const nama = document.getElementById("namaPenerima").value.trim();
  const hp = document.getElementById("noHp").value.trim();
  const alamat = document.getElementById("alamatLengkap").value.trim();
  const keranjang = JSON.parse(localStorage.getItem("keranjangToko")) || [];

  // Validasi
  if(!nama || !hp || !alamat){
    alert("❌ Isi Nama, Nomor HP, Alamat lengkap");
    return;
  }
  if(keranjang.length === 0){
    alert("❌ Keranjang kosong, kembali belanja");
    return;
  }

  const subtotal = keranjang.reduce((sum,item)=> sum + (Number(item.harga)*Number(item.jumlah)), 0);
  const pesananData = {
    namaPenerima: nama,
    noHp: hp,
    alamat: alamat,
    barang: keranjang,
    subtotal: subtotal,
    ongkir: ONGKIR,
    totalBayar: subtotal + ONGKIR,
    status: "Menunggu Diproses",
    tanggal: new Date().toLocaleString("id-ID")
  }

  await push(ref(db, "pesanan"), pesananData);
  localStorage.removeItem("keranjangToko");

  // === TOAST ===
  const toast = document.getElementById("toastCheckout");
  toast.style.display = "block";

  setTimeout(()=>{
    toast.style.display = "none";
    window.location.href = "index.html";
  }, 3000);
}) // ✅ Kurung penutup fungsi klik tombol (YANG HILANG DI KODE KAMU)

// ✅ muatCheckout() DIPINJAM DI LUAR (BUKAN DALAM KLIK TOMBOL)
muatCheckout();
</script>

<!-- TOAST -->
<div id="toastCheckout">✅ Pesanan Berhasil Dikirim!</div>
</body>
</html>
